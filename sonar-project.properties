sonar.projectKey=juusolatva_sudo-agent
sonar.organization=juusolatva
sonar.projectName=sudo-agent
sonar.projectVersion=0.4.3

# Coverage produced by `cargo llvm-cov --lcov --output-path lcov.info` in build.yml.
sonar.rust.lcov.reportPaths=lcov.info
 
# Fail the CI job when the quality gate (incl. coverage on new code) fails.
sonar.qualitygate.wait=true
