name: Build
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
# A newer push to the same PR cancels the run it supersedes; runs on main
# always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_TERM_COLOR: always
jobs:
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    # Something hung (e.g. a test) fails the job instead of running for
    # GitHub's 6-hour limit.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Check formatting
        run: cargo fmt --check
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

  # The oldest Rust we support (rust-version in Cargo.toml). Catches a change
  # or dependency update that needs a newer one.
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    # Something hung (e.g. a test) fails the job instead of running for
    # GitHub's 6-hour limit.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          rustup toolchain install "$msrv" --profile minimal --no-self-update
          rustup default "$msrv"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Run the tests
        run: cargo test --locked

  # Also runs the tests: cargo llvm-cov builds and runs them for coverage.
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    # Something hung (e.g. a test) fails the job instead of running for
    # GitHub's 6-hour limit.
    timeout-minutes: 30
    env:
      # PRs from forks get no secrets, so without SONAR_TOKEN the analysis
      # would fail the job; they skip the SonarQube steps but still run the
      # tests.
      SONAR_ANALYSIS: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
          persist-credentials: false
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,llvm-tools-preview --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-llvm-cov@0.9.1
          fallback: none
      - name: Generate coverage report
        run: cargo llvm-cov --all-features --locked --lcov --output-path lcov.info
      - name: Get the week for the SonarQube cache key
        id: week
        if: env.SONAR_ANALYSIS == 'true'
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      # An exact key hit never saves, so a fixed key would keep the first
      # plugins and JRE for good. A new key each week starts empty (no
      # restore-keys, so old versions don't pile up) and picks up what
      # SonarCloud currently serves.
      - name: Cache SonarQube packages
        if: env.SONAR_ANALYSIS == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar-${{ steps.week.outputs.week }}
      - name: SonarQube Scan
        if: env.SONAR_ANALYSIS == 'true'
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
