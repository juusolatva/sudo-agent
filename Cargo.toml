[package]
name = "sudo-agent"
version = "0.1.0"
edition = "2024"
authors = ["Juuso Latva <juuso.latva@gmail.com>"]
description = "A lightweight, PAM-aware SSH agent daemon for time-bound sudo authentication."
license = "MIT"
repository = "https://github.com/juusolatva/sudo-agent"
readme = "README.md"
keywords = ["ssh", "sudo", "pam", "security", "agent"]
categories = ["command-line-utilities", "authentication"]

[dependencies]
async-trait = "0.1.92"
ssh-agent-lib = "0.6.0"
ssh-key = "0.6.7"
tokio = { version = "1.53.1", features = ["full"] }
