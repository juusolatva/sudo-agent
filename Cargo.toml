[package]
name = "sudo-agent"
version = "0.1.0"
edition = "2024"
authors = ["Juuso Latva <juuso.latva@gmail.com>"]
description = "A lightweight, PAM-aware SSH agent daemon for time-bound sudo authentication."
license = "MIT"
repository = "https://github.com/juusolatva/sudo-agent"
readme = "README.md"
keywords = ["ssh", "sudo", "pam", "security", "agent"]
categories = ["command-line-utilities", "authentication"]
# Ship only what's needed to build and read about the crate; development notes
# (AGENTS.md, TODO.md, docs/, .serena/) stay in the repository.
include = ["src/**/*.rs", "Cargo.toml", "Cargo.lock", "LICENSE", "README.md"]

[dependencies]
async-trait = "0.1.92"
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2"
rpassword = "7.5.4" # betterleaks:allow (crate name trips generic-password)
signature = "2.2.0"
ssh-agent-lib = "0.6.0"
ssh-key = { version = "0.6.7", features = ["crypto", "encryption"] }
tokio = { version = "1.53.1", features = ["full"] }
zeroize = "1.9.1"

[dev-dependencies]
tempfile = "3.27.0"
