# OSV-Scanner configuration (read by `osv-scanner`, including osv-scanner.yml).
# Keep in sync with `.cargo/audit.toml`.

[[IgnoredVulns]]
id = "RUSTSEC-2023-0071"
reason = "rsa Marvin Attack timing side channel (via ssh-key); every RSA signature is gated on human approval, whose latency swamps timing differences. Tracked in GHSA-wwj9-h88v-6483 and RustCrypto/RSA#626."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0387"
reason = "crypto-bigint 0.5 timing variability (via ssh-key ECDSA curves); every ECDSA signature is gated on human approval. Waiting on ssh-key 0.7 + ssh-agent-lib update. Tracked in GHSA-rj9x-w6xp-x994."

[[IgnoredVulns]]
id = "GHSA-qwgh-2vcv-g2f7"
reason = "block-buffer 0.10 cursor corrupted if a hash's compress callback panics and the caller catches the panic and reuses the hasher (via digest 0.10, the whole RustCrypto stack under ssh-key 0.6). Not reachable: the callbacks are RustCrypto's fixed SHA compression functions, which don't panic on any input, and nothing reuses a hasher after a panic. Fixed only in block-buffer 0.12.1; waiting on ssh-key 0.7 + ssh-agent-lib update. No RustSec ID yet (add it to .cargo/audit.toml when one exists)."
